name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        id: prep
        run: |
          # If you uploaded only RpgTranslator.zip, extract it here.
          if [ -f RpgTranslator.zip ]; then unzip -oq RpgTranslator.zip; fi
          if [ -d RpgTranslator ]; then
            echo "dir=RpgTranslator" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # The version number comes from GITHUB_RUN_NUMBER (rises on every build) and the APK is always
      # signed with the same key (app/rpgtl.jks), so each new APK installs over the old one as an update.
      - name: Build APK
        run: gradle -p "${{ steps.prep.outputs.dir }}" assembleRelease --no-daemon

      - name: Name the APK
        run: cp "${{ steps.prep.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" "RPG-Maker-Translator.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RPG-Maker-Translator
          path: RPG-Maker-Translator.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RPG Maker Translator build ${{ github.run_number }}
          files: RPG-Maker-Translator.apk
