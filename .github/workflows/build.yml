name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar projeto
        id: prep
        run: |
          # Se você enviou só o RpgTranslator.zip, extrai aqui.
          if [ -f RpgTranslator.zip ]; then unzip -oq RpgTranslator.zip; fi
          if [ -d RpgTranslator ]; then
            echo "dir=RpgTranslator" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK
        run: gradle -p "${{ steps.prep.outputs.dir }}" assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RpgTranslator-apk
          path: ${{ steps.prep.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ${{ steps.prep.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
